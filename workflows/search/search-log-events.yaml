# =============================================================================
# Workflow: Search Log Events
# Category: search
#
# Queries any index/data stream by field value using Lucene query_string
# syntax. Supports wildcards (e.g. lottery* matches lottery.auth).
#
# Builds a single query string via Liquid to avoid branches and the
# Liquid-as-JSON-key limitation (Kibana Workflows only resolve templates
# in values, not keys).
#
# The console output shows a hit-count summary for manual testing.
# When invoked as an agent tool the full structured response from the
# search step is available to the calling agent.
#
# Author: Security Agent Mesh
# =============================================================================
name: Search Log Events
description: >
  Search any log index by field value — returns matching documents sorted
  by timestamp. Supports wildcards (e.g. lottery* matches lottery.auth).

tags:
  - agent-mesh
  - search
  - investigation

inputs:
  - name: index_name
    type: string
    description: >
      Index or data stream to search (e.g., logs-auth-lottery,
      logs-aws.cloudwatch-default, filebeat-*).
    required: true
  - name: search_field
    type: string
    description: >
      The field to search on (e.g., device.id, source.ip, user.name,
      event.outcome). Use dot notation for nested fields.
    required: true
  - name: search_value
    type: string
    description: >
      The value to search for. Supports wildcards — e.g. lottery* matches
      lottery.auth and lottery.account_activity.
    required: true
  - name: time_range
    type: string
    description: >
      Optional. Elasticsearch date math expression for the start of the
      time window (e.g. now-24h, now-7d). Omit for all time.
    required: false
  - name: additional_filter_field
    type: string
    description: >
      Optional second field to filter on (e.g. event.outcome).
    required: false
  - name: additional_filter_value
    type: string
    description: Value for the additional filter field.
    required: false
  - name: max_results
    type: string
    description: Maximum results to return (default 20).
    required: false

consts:
  es_url: "__ES_URL__"
  es_api_key: "__ES_API_KEY__"

triggers:
  - type: manual

steps:

  - name: build_query
    type: console
    with:
      message: "{{ inputs.search_field }}:{{ inputs.search_value }}{% if inputs.additional_filter_field %} AND {{ inputs.additional_filter_field }}:{{ inputs.additional_filter_value }}{% endif %}"

  - name: resolve_time
    type: console
    with:
      message: "{{ inputs.time_range | default: '1970-01-01' }}"

  - name: resolve_max
    type: console
    with:
      message: "{{ inputs.max_results | default: '20' }}"

  - name: search
    type: http
    on-failure:
      continue: true
    with:
      method: POST
      url: "{{ consts.es_url }}/{{ inputs.index_name }}/_search"
      headers:
        Content-Type: application/json
        Authorization: "ApiKey {{ consts.es_api_key }}"
      body:
        size: "{{ steps.resolve_max.output }}"
        sort:
          - "@timestamp": "desc"
        query:
          bool:
            must:
              - query_string:
                  query: "{{ steps.build_query.output }}"
                  analyze_wildcard: true
            filter:
              - range:
                  "@timestamp":
                    gte: "{{ steps.resolve_time.output }}"

  - name: output
    type: console
    with:
      message: |
        Query: {{ steps.build_query.output }}
        Index: {{ inputs.index_name }}
        Time filter: >= {{ steps.resolve_time.output }}
        Total hits: {{ steps.search.output.data.hits.total.value }}
        Returned: {{ steps.resolve_max.output }}
